name: Build and deploy WEB to Azure

# Desativado — usa master_gestorfinanceiro.yml
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build
        run: dotnet build GestorFinanceiro.Web --configuration Release

      - name: Publish
        run: dotnet publish GestorFinanceiro.Web -c Release -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: publish

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: gestorfinanceiro-web
          package: .
